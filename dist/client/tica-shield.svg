  <path d="M100 8 L188 40 L188 120 C188 170 148 210 100 232 C52 210 12 170 12 120 L12 40 Z"
        fill="#0c1324" stroke="#1493ff" stroke-width="2.5"/>
  <!-- Shield inner highlight -->
  <path d="M100 22 L175 50 L175 120 C175 163 140 198 100 218 C60 198 25 163 25 120 L25 50 Z"
        fill="none" stroke="#1493ff" stroke-width="1" opacity="0.3"/>
